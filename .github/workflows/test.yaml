name: Verify the library

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: macos-latest
    timeout-minutes: 45
    if: ${{ !contains(github.event.pull_request.body || '', '[skip verify]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build, test, and verify publications
        run: >-
          ./gradlew
          --no-daemon
          clean
          build
          checkKotlinAbi
          publishAllPublicationsToLocalReleaseRepository
          --console=plain

      - name: Verify published consumers and dependency isolation
        run: >-
          ./gradlew
          --no-daemon
          -p samples/consumer
          -PcacheRepository="${{ github.workspace }}/build/local-maven"
          clean
          build
          --refresh-dependencies
          --console=plain

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Report build failure
        if: failure()
        run: echo "Gradle build failed. See artifacts for reports."
